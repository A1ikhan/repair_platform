{% extends 'base.html' %}

{% block title %}Регистрация - Repair Platform{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>📝 Регистрация</h2>
        
        <form id="register-form">
            <div class="form-group">
                <label for="username">Логин *</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль *</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="first_name">Имя</label>
                <input type="text" id="first_name" name="first_name">
            </div>
            
            <div class="form-group">
                <label for="last_name">Фамилия</label>
                <input type="text" id="last_name" name="last_name">
            </div>
            
            <div class="form-group">
                <label for="user_type">Тип пользователя *</label>
                <select id="user_type" name="user_type" required>
                    <option value="">Выберите тип</option>
                    <option value="customer">Клиент</option>
                    <option value="worker">Работник</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-block">Зарегистрироваться</button>
        </form>
        
        <div class="auth-links">
            <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
            <p><a href="{% url 'index' %}">← Вернуться на главную</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('register-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const userData = {
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            first_name: document.getElementById('first_name').value,
            last_name: document.getElementById('last_name').value,
            user_type: document.getElementById('user_type').value
        };
        
        const submitBtn = this.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Регистрация...';
        
        try {
            const response = await fetch(`${API_BASE_URL}/auth/register`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });
            
            const data = await response.json();
            
            if (response.ok) {
                showAlert('Регистрация успешна! Теперь вы можете войти.', 'success');
                
                // Автоматически заполняем форму входа
                setTimeout(() => {
                    window.location.href = '/login/';
                }, 1500);
                
            } else {
                showAlert(data.message || 'Ошибка регистрации', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Зарегистрироваться';
            }
        } catch (error) {
            showAlert('Ошибка соединения', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Зарегистрироваться';
        }
    });
</script>
{% endblock %}
