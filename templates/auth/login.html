{% extends 'base.html' %}

{% block title %}Вход - Repair Platform{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>🔑 Вход в систему</h2>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-block">Войти</button>
        </form>
        
        <div class="auth-links">
            <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
            <p><a href="{% url 'index' %}">← Вернуться на главную</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        const submitBtn = this.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Вход...';
        
        try {
            const response = await fetch(`${API_BASE_URL}/auth/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, password })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                // Сохраняем токены
                localStorage.setItem('access_token', data.access);
                localStorage.setItem('refresh_token', data.refresh);
                localStorage.setItem('user', JSON.stringify(data.user || {username}));
                
                showAlert('Успешный вход!', 'success');
                
                // Перезагружаем страницу для обновления меню
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
                
            } else {
                showAlert(data.message || 'Ошибка входа', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Войти';
            }
        } catch (error) {
            showAlert('Ошибка соединения', 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Войти';
        }
    });
</script>
{% endblock %}
